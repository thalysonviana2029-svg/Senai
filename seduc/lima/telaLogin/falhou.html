
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ops! Deu errado 🥺</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #fff4e8, #fce5d5, #f9dce0);
    overflow: hidden;
}

.container {
    text-align: center;
    padding: 35px 25px;
    width: 90%;
    max-width: 430px;
    background: rgba(255,255,255,0.75);
    border: 2px solid white;
    border-radius: 30px;
    box-shadow: 0 15px 40px rgba(130, 83, 53, 0.12);
    animation: aparecer 0.8s ease;
}

.personagem {
    position: relative;
    display: inline-block;
    animation: triste 3s ease-in-out infinite;
}

.personagem img {
    width: 270px;
    max-width: 100%;
    display: block;
    filter: drop-shadow(0 8px 5px rgba(80,50,20,0.1));
}

h1 {
    color: #a96536;
    font-size: 32px;
    margin-top: 15px;
    animation: aparecer 1s ease;
}

p {
    color: #806b60;
    font-size: 16px;
    line-height: 1.6;
    margin: 12px 0 25px;
}

.detalhe {
    color: #c28c6d;
    font-size: 13px;
    margin-top: -12px;
    margin-bottom: 22px;
}

button {
    background: #b87949;
    color: white;
    border: none;
    border-radius: 15px;
    padding: 14px 30px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 5px 12px rgba(130,83,53,0.2);
}

button:hover {
    background: #965b35;
    transform: translateY(-3px);
    box-shadow: 0 8px 18px rgba(130,83,53,0.25);
}

button:active {
    transform: scale(0.96);
}

.lagrima {
    position: absolute;
    font-size: 20px;
    animation: cair 2s infinite;
    opacity: 0;
}

.lagrima.um {
    top: 53%;
    left: 29%;
    animation-delay: 0.2s;
}

.lagrima.dois {
    top: 53%;
    right: 28%;
    animation-delay: 1.1s;
}

.coracao {
    position: fixed;
    color: #e6a6a0;
    opacity: 0.35;
    animation: flutuar 5s infinite ease-in-out;
    pointer-events: none;
}

.c1 { top: 12%; left: 12%; font-size: 30px; }
.c2 { top: 75%; right: 12%; font-size: 24px; animation-delay: 1s; }
.c3 { top: 20%; right: 18%; font-size: 20px; animation-delay: 2s; }
.c4 { bottom: 12%; left: 17%; font-size: 26px; animation-delay: 3s; }

@keyframes triste {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(5px) rotate(-2deg); }
    50% { transform: translateY(2px) rotate(0deg); }
    75% { transform: translateY(5px) rotate(2deg); }
}

@keyframes cair {
    0% { transform: translateY(-5px); opacity: 0; }
    30% { opacity: 1; }
    100% { transform: translateY(45px); opacity: 0; }
}

@keyframes flutuar {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-20px); }
}

@keyframes aparecer {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

@media(max-width: 400px) {
    .personagem img { width: 230px; }
    h1 { font-size: 27px; }
}
</style>
</head>

<body>

<div class="coracao c1">♡</div>
<div class="coracao c2">♡</div>
<div class="coracao c3">♡</div>
<div class="coracao c4">♡</div>

<main class="container">

    <div class="personagem">
        <img src="assents/images.png" alt="Personagem triste">

        <span class="lagrima um">💧</span>
        <span class="lagrima dois">💧</span>
    </div>

    <h1>Ops... Deu errado!</h1>

    <p>
        Parece que alguma coisa não deu certo...<br>
        O usuário ou a senha estão incorretos.
    </p>

    <div class="detalhe">
        🥺 Confira seus dados e tente novamente...
    </div>

    <button onclick="history.back()">
        Tentar novamente
    </button>

</main>

</body>
</html>
