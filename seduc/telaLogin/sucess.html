
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sucesso! 💛</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;

    background: linear-gradient(
        135deg,
        #f9d77e,
        #e8a64c,
        #a96d43
    );
}

/* Tela principal */

.container {
    width: 90%;
    max-width: 430px;
    padding: 35px 20px;
    text-align: center;

    background: rgba(255, 248, 220, 0.95);

    border: 4px solid #70452d;
    border-radius: 25px;

    box-shadow: 0 12px 0 #70452d,
                0 20px 35px rgba(0,0,0,0.2);

    position: relative;
    z-index: 2;

    animation: aparecer 1s ease;
}

@keyframes aparecer {
    from {
        opacity: 0;
        transform: scale(0.5);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

/* Título */

h1 {
    color: #a65f2b;
    font-size: 34px;
    margin-bottom: 12px;

    animation: brilho 1.5s infinite alternate;
}

@keyframes brilho {
    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.08);
    }
}

p {
    color: #70452d;
    font-size: 17px;
    margin: 12px 0;
}

/* Eevee dançando */

.eevee {
    width: 280px;
    max-width: 90%;
    height: auto;

    image-rendering: pixelated;

    animation: dancar 0.8s infinite ease-in-out;
    transform-origin: center bottom;
}

@keyframes dancar {

    0% {
        transform: rotate(-12deg)
                   translateY(0)
                   scale(1);
    }

    25% {
        transform: rotate(12deg)
                   translateY(-22px)
                   scale(1.04);
    }

    50% {
        transform: rotate(-12deg)
                   translateY(0)
                   scale(1);
    }

    75% {
        transform: rotate(12deg)
                   translateY(-22px)
                   scale(1.04);
    }

    100% {
        transform: rotate(-12deg)
                   translateY(0)
                   scale(1);
    }
}

/* Botão */

button {
    background: #d99040;
    color: white;

    border: 3px solid #70452d;
    border-radius: 15px;

    padding: 14px 30px;
    margin-top: 15px;

    font-size: 17px;
    font-weight: bold;

    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.1);
    background: #a65f2b;
}

/* Confetes */

.confete {
    position: absolute;
    top: -20px;

    width: 10px;
    height: 10px;

    animation: cair linear infinite;
}

@keyframes cair {
    0% {
        transform: translateY(-10vh) rotate(0deg);
    }

    100% {
        transform: translateY(110vh) rotate(720deg);
    }
}

/* Estrelinhas */

.estrela {
    position: absolute;
    font-size: 30px;

    animation: flutuar 2s infinite ease-in-out;
}

@keyframes flutuar {
    0%, 100% {
        transform: translateY(0) rotate(0);
    }

    50% {
        transform: translateY(-25px) rotate(20deg);
    }
}

</style>
</head>

<body>

<div class="estrela" style="top:10%; left:10%">✨</div>
<div class="estrela" style="top:20%; right:12%">⭐</div>
<div class="estrela" style="bottom:15%; left:12%">✨</div>
<div class="estrela" style="bottom:20%; right:10%">💛</div>

<div class="container">

    <h1>🎉 SUCESSO! 🎉</h1>

    <p>Parabéns! Você conseguiu!</p>

    <!-- Imagem do Eevee -->
    <img
        src="assents/dhb42ve-e5adf09d-a189-4519-942c-636084560568.png"
        alt="Eevee dançando"
        class="eevee"
    >

    <p>UHUUUU conseguiu acessas seu tchola💛</p>

    <button onclick="comemorar()">
        Comemorar! 🎊
    </button>

</div>

<script>

// Cores dos confetes

const cores = [
    "#fff176",
    "#ffffff",
    "#d99040",
    "#a65f2b",
    "#f4b942",
    "#ff8a65"
];

// Criar confetes

function criarConfetes() {

    for (let i = 0; i < 70; i++) {

        const confete = document.createElement("div");

        confete.className = "confete";

        confete.style.left = Math.random() * 100 + "vw";

        confete.style.backgroundColor =
            cores[Math.floor(Math.random() * cores.length)];

        confete.style.animationDuration =
            (Math.random() * 3 + 2) + "s";

        confete.style.animationDelay =
            Math.random() * 5 + "s";

        document.body.appendChild(confete);
    }
}

// Botão de comemoração

function comemorar() {

    alert("Se quiser Tota-Tola, vai comprar! 💛🎉");

    criarConfetes();
}

criarConfetes();

</script>

</body>
</html>
